name: macOS arm64 release

# Builds only the Apple Silicon release bundle from the selected branch and
# publishes that archive on a commit-scoped GitHub release. It does not build
# Windows or Linux, and it does not publish a stable three-platform v* release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-arm64-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: macos-arm64-release
          cache-bin: false
          save-if: false
      - name: Validate source version
        id: source
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          VERSION="$(node scripts/release-assets.mjs source "$TAG")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install frontend dependencies
        run: npm ci
      - name: Test macOS signature integrity gates
        run: node --test scripts/test-macos-bundle.mjs
      - name: Build complete ad-hoc signed app bundle
        env:
          # Complete bundle sealing; not Developer ID signing or notarization.
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app -- --locked
      - name: Verify and stage the arm64 release bundle
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: bash scripts/stage-macos-release.sh src-tauri/target/aarch64-apple-darwin/release/bundle/macos "$VERSION" artifacts/release
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish macOS arm64 package
    needs: macos
    if: needs.macos.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64-release-${{ github.sha }}
          path: artifacts/macos-release
      - name: Publish the macOS package
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-macos-build.mjs artifacts/macos-release "macos-arm64-release-${{ github.sha }}" "${{ github.sha }}" "$GITHUB_REPOSITORY"
